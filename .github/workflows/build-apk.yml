name: Build and Release APK

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Prepare Debug Keystore and Env
        run: |
          if [ ! -f "debug.keystore" ]; then
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi
          if [ ! -f ".env" ]; then
            cp .env.example .env 2>/dev/null || touch .env
          fi

      - name: Build Debug APK
        run: |
          gradle assembleDebug --no-daemon --no-configuration-cache

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: RangaAIStudio-APK
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Publish APK Release
        uses: softprops/action-gh-release@v2
        if: always()
        with:
          tag_name: latest
          name: "Ranga AI Studio - APK Instalável"
          body: "Baixe o arquivo **app-debug.apk** abaixo diretamente no seu celular Android para instalar o aplicativo!"
          draft: false
          prerelease: false
          files: app/build/outputs/apk/debug/app-debug.apk
